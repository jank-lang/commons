name: Test packages
description: Install Babashka, install packages, and compile each package example.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        curl -sL -o install-bb https://raw.githubusercontent.com/babashka/babashka/master/install
        chmod +x install-bb
        sudo ./install-bb
        which bb

        curl -sLO https://raw.githubusercontent.com/clj-kondo/clj-kondo/master/script/install-clj-kondo
        chmod +x install-clj-kondo
        ./install-clj-kondo
        which clj-kondo

        failed_packages=()

        for project in */project.clj;
        do
          package="${project%/project.clj}"

          pushd "${package}"
          if [[ -f "jank-build.bb" ]]; then
            clj-kondo --lint jank-build.bb || failed_packages+=("${package}")
          fi
          lein install || failed_packages+=("${package}")
          popd
        done

        if (( ${#failed_packages[@]} > 0 ));
        then
          echo "Packages with installation failures:"
          printf ' - %s\n' "${failed_packages[@]}"
          exit 1
        fi


        for dir in */example;
        do
          package="${dir%/example}"
          package_failed=0

          pushd "${dir}"
          lein compile || package_failed=1
          lein with-profile +release compile || package_failed=1
          popd

          if [[ "${package_failed}" == 1 ]];
          then
            failed_packages+=("${package}")
          fi
        done

        if (( ${#failed_packages[@]} > 0 ));
        then
          echo "Packages with compilation failures:"
          printf ' - %s\n' "${failed_packages[@]}"
          exit 1
        fi
