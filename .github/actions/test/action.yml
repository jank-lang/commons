name: Test packages
description: Install Babashka, install packages, and compile each package example.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        curl -sL -o install-bb https://raw.githubusercontent.com/babashka/babashka/master/install
        chmod +x install-bb
        sudo ./install-bb
        which bb

        failed_packages=()

        for project in */project.clj;
        do
          package="${project%/project.clj}"

          pushd "${package}"
          lein install || failed_packages+=("${package}")
          popd
        done

        if (( ${#failed_packages[@]} > 0 ));
        then
          echo "Packages with installation failures:"
          printf ' - %s\n' "${failed_packages[@]}"
          exit 1
        fi

        shared_target="${RUNNER_TEMP}/target"
        mkdir -p "${shared_target}"

        for dir in */example;
        do
          package="${dir%/example}"
          package_failed=0

          pushd "${dir}"
          lein update-in :jank assoc :target-dir "\"${shared_target}\"" -- compile || package_failed=1
          lein with-profile +release update-in :jank assoc :target-dir "\"${shared_target}\"" -- compile || package_failed=1
          popd

          if [[ "${package_failed}" == 1 ]];
          then
            failed_packages+=("${package}")
          fi
        done

        if (( ${#failed_packages[@]} > 0 ));
        then
          echo "Packages with compilation failures:"
          printf ' - %s\n' "${failed_packages[@]}"
          exit 1
        fi
