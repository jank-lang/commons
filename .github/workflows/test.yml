name: Test packages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Only allow one build per branch at a time. New builds will cancel existing builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-test:
    name: Ubuntu 24.04 - Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: awalsh128/cache-apt-pkgs-action@5902b33ae29014e6ca012c5d8025d4346556bd40
        with:
          packages: curl git build-essential pkg-config ninja-build cmake libopengl-dev libglfw3-dev libsqlite3-dev
          # Increment this when the package list changes.
          version: 1
      - name: Install jank
        run: |
          sudo apt install -y curl gnupg lsb-release
          curl -s "https://ppa.jank-lang.org/KEY.gpg" | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/jank.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/jank.gpg] https://ppa.jank-lang.org $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/jank.list >/dev/null
          sudo apt update
          sudo apt install -y jank
      - name: Test packages
        run: |
          for dir in */example;
          do
            cd "${dir}"
            lein compile || jank_error=1
          done
          if [[ "${jank_error}" == 1 ]];
          then
            exit 1
          fi

  macos-test:
    name: macOS - Test
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Homebrew deps
        run: |
          brew install git pkg-config ninja cmake glfw sqlite3
      - name: Install jank
        run: |
          brew install jank-lang/jank/jank clojure/tools/clojure
      - name: Test packages
        run: |
          for dir in */example;
          do
            cd "${dir}"
            lein compile || jank_error=1
          done
          if [[ "${jank_error}" == 1 ]];
          then
            exit 1
          fi
